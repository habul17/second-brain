# Nightly database backup. The repo is public, so the dump is encrypted (AES-256)
# before it's stored as a workflow artifact. Kept for 30 days.
#
# Restore:
#   gpg --decrypt brain-YYYY-MM-DD.dump.gpg > brain.dump
#   pg_restore --no-owner --clean --if-exists -d "$DATABASE_URL" brain.dump
name: Nightly backup

on:
  schedule:
    - cron: "30 21 * * *" # 03:00 in India
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pg_dump refuses to dump a server newer than itself, so install the server's major version.
      - name: Install a Postgres client that matches the server
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          major=$(psql "$DATABASE_URL" -tAc "show server_version_num" | cut -c1-2)
          sudo apt-get install -y -qq "postgresql-client-$major"
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          pg_dump --version
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --format=custom --file=brain.dump
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output "brain-$(date -u +%F).dump.gpg" brain.dump
          rm brain.dump
          ls -lh brain-*.dump.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: brain-backup-${{ github.run_number }}
          path: brain-*.dump.gpg
          retention-days: 30
          if-no-files-found: error
